<!DOCTYPE html>
<html>
<head>
    <title>Financial Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f8f8f8;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }
        h2 { text-align: center; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        input[type="submit"] {
            padding: 10px 20px;
            background: #007bff;
            border: none;
            color: white;
            border-radius: 5px;
        }
        .response {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Financial Chatbot</h2>
    <form method="POST">
        <input type="text" name="query" placeholder="Ask a financial question..." required>
        <input type="submit" value="Ask">
    </form>
    {% if response %}
    <div class="response">
        Chatbot: {{ response }}
    </div>
    {% endif %}
</div>
</body>
</html>
